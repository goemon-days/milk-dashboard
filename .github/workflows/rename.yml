name: Temporary rename
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          if [ -f m-lkdatusiyubodo.html ]; then
            git config user.name "goemon-days"
            git config user.email "goemon-days@users.noreply.github.com"
            git mv m-lkdatusiyubodo.html index.html
            git commit -m "Rename m-lkdatusiyubodo.html to index.html"
            git push
          else
            echo "Source file not found; nothing to rename"
          fi
