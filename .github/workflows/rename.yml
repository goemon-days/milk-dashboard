name: rename-to-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "reizouko-kyouyou"
          git config user.email "reizouko-kyouyou@users.noreply.github.com"
          git mv m-lkdatusiyubodo.html index.html
          git commit -m "Rename m-lkdatusiyubodo.html to index.html"
          git push
